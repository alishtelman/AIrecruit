services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recruiting
      POSTGRES_PASSWORD: recruiting
      POSTGRES_DB: recruiting
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruiting -d recruiting"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      media-service:
        condition: service_healthy
      resume-service:
        condition: service_healthy
      sandbox-service:
        condition: service_healthy
      llm-service:
        condition: service_healthy
    env_file:
      - .env
    environment:
      MEDIA_SERVICE_URL: http://media-service:8080
      RESUME_SERVICE_URL: http://resume-service:8080
      SANDBOX_SERVICE_URL: http://sandbox-service:8080
      LLM_SERVICE_URL: http://llm-service:8080
      REPORT_WORKER_MODE: ${REPORT_WORKER_MODE:-embedded}
      INTERNAL_WORKER_TOKEN: ${INTERNAL_WORKER_TOKEN:-dev-internal-worker-token}
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
      - ./backend/storage:/app/storage
      - recordings:/app/storage/recordings
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  media-service:
    build: ./services/media
    env_file:
      - .env
    ports:
      - "8081:8080"
    volumes:
      - recordings:/app/storage/recordings
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 6

  resume-service:
    build: ./services/resume
    environment:
      RESUME_STORAGE_DIR: /app/storage/resumes
      MAX_RESUME_SIZE_MB: ${MAX_RESUME_SIZE_MB:-10}
    ports:
      - "8083:8080"
    volumes:
      - ./backend/storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 6

  sandbox-service:
    build: ./services/sandbox
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 6

  llm-service:
    build: ./services/llm
    env_file:
      - .env
    ports:
      - "8084:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 6

  report-worker:
    build: ./services/report-worker
    profiles:
      - workers
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      INTERNAL_WORKER_TOKEN: ${INTERNAL_WORKER_TOKEN:-dev-internal-worker-token}
      REPORT_WORKER_INTERVAL_SECONDS: ${REPORT_WORKER_INTERVAL_SECONDS:-5}
      REPORT_WORKER_REQUEST_TIMEOUT_SECONDS: ${REPORT_WORKER_REQUEST_TIMEOUT_SECONDS:-300}
      REPORT_WORKER_DRY_RUN: ${REPORT_WORKER_DRY_RUN:-false}
      REPORT_WORKER_MAX_JOBS_PER_CYCLE: ${REPORT_WORKER_MAX_JOBS_PER_CYCLE:-1}
      REPORT_WORKER_HEALTH_ADDR: :8080
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 6

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    env_file:
      - .env
    environment:
      NEXT_DIST_DIR: .next-dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next-dev
    command: sh -lc 'mkdir -p "${NEXT_DIST_DIR:-.next-dev}" && find "${NEXT_DIST_DIR:-.next-dev}" -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true; npm run dev'

volumes:
  postgres_data:
  uploads:
  recordings:
